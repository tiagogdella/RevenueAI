services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: revenueai
      POSTGRES_PASSWORD: revenueai
      POSTGRES_DB: billing
    ports:
      - "55101:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueai -d billing"]
      interval: 3s
      retries: 20

volumes:
  dbdata: